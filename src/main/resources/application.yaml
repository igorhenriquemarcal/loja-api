spring:
  application:
    name: loja-api

  # banco H2 salvo em arquivo, na pasta "data" do projeto
  datasource:
    url: jdbc:h2:file:./data/lojadb
    username: sa
    password: ""

  jpa:
    hibernate:
      # cria e atualiza as tabelas sozinho, a partir das classes
      ddl-auto: update
    # mostra no console os comandos SQL que o Hibernate gera
    show-sql: true